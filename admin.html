<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Free Cur · 主题上架管理</title><style>
:root{color-scheme:light;--pink:#bb5377;--ink:#403346;--muted:#867c88;--line:#e9dfe5}*{box-sizing:border-box}body{margin:0;background:#fbf8f2;color:var(--ink);font:16px/1.7 system-ui,sans-serif}main{max-width:1160px;margin:50px auto;padding:0 24px}header{display:flex;justify-content:space-between;align-items:center;gap:15px}a{color:var(--pink)}h1{font-size:32px;margin:8px 0}small,p{color:var(--muted)}.badge{font-size:12px;letter-spacing:2px;color:var(--pink)}.stats,.tools{display:flex;gap:12px;margin:24px 0;flex-wrap:wrap}.stat{padding:16px 24px;border:1px solid var(--line);border-radius:12px;background:white;min-width:150px}.stat b{font-size:26px;display:block}input,select,button{font:inherit;border:1px solid var(--line);border-radius:9px;padding:9px 13px;background:white;color:var(--ink)}input{flex:1;min-width:200px}button{cursor:pointer;color:var(--pink)}button:disabled{opacity:.5;cursor:wait}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:13px;background:white}table{width:100%;border-collapse:collapse;white-space:nowrap}td,th{padding:15px 20px;text-align:left;border-bottom:1px solid var(--line)}th{font-size:13px;color:var(--muted)}.published{color:#28775c}.hidden{color:#a07577}.notice{padding:16px 20px;background:#fbe9ef;border-radius:12px;margin:22px 0;font-size:14px}#status{min-height:25px;font-size:14px}.audit,footer{font-size:13px;color:var(--muted)}footer{margin:25px 0}@media(max-width:650px){main{margin:22px auto;padding:0 15px}h1{font-size:25px}.stat{flex:1;min-width:90px;padding:12px}td,th{padding:12px}}</style><script defer src="/admin/admin.js"></script></head><body><main>
<header><div><div class="badge">FREE CUR / PUBLISHER</div><h1>给喜欢，上架一点新意。</h1><small>仅管理主题素材和可选目录，不控制用户电脑。</small></div><a href="/">查看网站 ↗</a></header>
<div class="stats"><div class="stat"><b id="total">—</b>主题总数</div><div class="stat"><b id="published">—</b>已上架</div><div class="stat"><b id="hidden">—</b>已下架</div></div>
<div class="notice">客户端打开时、之后约每 30 分钟静默同步。下架只移出可选目录，不删除用户文件、不替换正在使用的光标。断网保留最近缓存。新增主题文件需先通过构建和校验；这里不能上传可执行文件或远程执行指令。</div>
<div class="tools"><input id="search" type="search" placeholder="搜索角色、系列、ID" aria-label="搜索主题"><select id="filter" aria-label="筛选状态"><option value="all">全部状态</option><option value="published">已上架</option><option value="hidden">已下架</option></select><button id="refresh">刷新</button></div><div id="status" role="status">正在读取目录…</div>
<div class="table-wrap"><table><thead><tr><th>角色</th><th>系列</th><th>类型</th><th>状态</th><th>操作</th></tr></thead><tbody id="themes"></tbody></table></div>
<h3>最近操作</h3><div id="audit" class="audit"></div><footer>管理入口有独立身份验证与 CSRF 防护。没有客户端设备标识、鼠标数据或安装者名单。</footer></main></body></html>
