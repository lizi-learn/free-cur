name: Build and verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-formats-and-clients:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y mono-devel nsis x11-apps libxcursor1 dpkg-dev p7zip-full python3-tk
          python -m pip install -r requirements.txt
          npm ci --no-audit --no-fund
          python tools/prepare_net48.py
      - name: Check optional image tooling
        run: |
          node --check prepare-pixel.mjs
          node --check prepare-role-frames.mjs
          node --input-type=module -e "import sharp from 'sharp'; console.log(sharp.versions.sharp)"
      - name: Build all active themes and clients
        run: python build.py
      - name: Verify native formats and package hashes
        run: python verify.py
      - name: Run tests without changing desktop cursors
        run: python -m unittest discover -p 'test_*.py' -v
      - name: Prepare static publishing directory
        run: python deploy.py --output build/public-site
